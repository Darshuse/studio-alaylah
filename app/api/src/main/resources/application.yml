server:
  port: ${API_PORT:8080}
  error:
    include-message: always          # أظهر رسالة الخطأ العربية للعميل
    include-binding-errors: always   # أظهر أخطاء التحقق من صحة الإدخال

spring:
  application:
    name: family-tales-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/familytales}
    username: ${DB_USER:familytales}
    password: ${DB_PASSWORD:familytales}
  jpa:
    hibernate:
      ddl-auto: validate        # المصدر الوحيد للـschema هو Flyway
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:familytales}
    password: ${RABBIT_PASSWORD:familytales}
    listener:
      simple:
        concurrency: ${GEN_WORKERS:2}          # workers متزامنة (تُزاد للتوسّع)
        max-concurrency: ${GEN_WORKERS_MAX:6}
        prefetch: 1                             # مهمة واحدة لكل worker (توليد ثقيل)
        default-requeue-rejected: false         # الفشل → dead-letter، لا إعادة لانهائية

# طابور التوليد (RabbitMQ): يفصل التوليد الثقيل عن الويب
queue:
  generation: ${GEN_QUEUE:ft.generation}

# مزوّد توليد الصور: mock (اختبار بلا تكلفة) | together (FLUX.2 + Kontext)
image:
  provider: ${IMAGE_PROVIDER:mock}
  together:
    key: ${TOGETHER_API_KEY:}
    model: ${TOGETHER_MODEL:black-forest-labs/FLUX.2-flex}
    edit-model: ${TOGETHER_EDIT_MODEL:black-forest-labs/FLUX.1-kontext-pro}

# سرد صوتي: none (تسجيل الأب الخام) | elevenlabs (استنساخ صوت الأب ينطق كل مشهد)
tts:
  provider: ${TTS_PROVIDER:none}
  elevenlabs:
    key: ${ELEVENLABS_API_KEY:}
    model: ${ELEVENLABS_MODEL:eleven_multilingual_v2}

# الفوترة والاستحقاق (نقاط اختبار المنح محميّة — تُفعّل في التطوير فقط)
billing:
  test-grant: ${BILLING_TEST_GRANT:false}
  webhook-secret: ${BILLING_WEBHOOK_SECRET:}   # سرّ مشترك مع مزوّد الدفع (يُضبط في الإنتاج)

# تركيب الفيديو عبر FFmpeg
video:
  ffmpeg: ${FFMPEG_PATH:ffmpeg}
  seconds-per-scene: 4

# التخزين المتوافق مع S3 (MinIO محليًا)
storage:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  bucket: ${S3_BUCKET:family-tales}
  access-key: ${S3_ACCESS_KEY:familytales}
  secret-key: ${S3_SECRET_KEY:familytales123}

# سر الـJWT — يجب تمريره كمتغيّر بيئة في الإنتاج (لا قيمة افتراضية للإنتاج)
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-production-0123456789abcdef}
    ttl-minutes: ${JWT_TTL:1440}
    # في الإنتاج: JWT_ALLOW_DEV_SECRET=false → يرفض الإقلاع بالسر الافتراضي
    allow-dev-secret: ${JWT_ALLOW_DEV_SECRET:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
