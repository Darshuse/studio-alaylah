services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: familytales
      POSTGRES_USER: familytales
      POSTGRES_PASSWORD: familytales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familytales"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: familytales
      RABBITMQ_DEFAULT_PASS: familytales
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # لوحة الإدارة
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: familytales
      MINIO_ROOT_PASSWORD: familytales123
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # console
    volumes:
      - miniodata:/data

  # ينشئ الـbucket تلقائيًا عند الإقلاع
  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 familytales familytales123) do sleep 2; done;
      mc mb -p local/family-tales || true;
      echo 'bucket ready';
      "

volumes:
  pgdata:
  miniodata:
